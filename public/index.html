<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RetroTube</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
    body { background: #f1f1f1; color: #333; }

    /* Header & Navigation */
    header {
      background: #ffffff;
      border-bottom: 1px solid #e8e8e8;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .logo {
      font-size: 22px;
      font-weight: bold;
      color: #222;
      text-decoration: none;
      letter-spacing: -1px;
      cursor: pointer;
      user-select: none;
    }
    .logo span {
      background: #cc181e;
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 2px;
    }
    .search-box {
      display: flex;
      flex: 1;
      max-width: 500px;
      min-width: 200px;
    }
    .search-box input {
      flex: 1;
      min-width: 0;
      padding: 8px 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-right: none;
      border-radius: 2px 0 0 2px;
      outline: none;
    }
    .search-box button {
      padding: 8px 14px;
      background: #f8f8f8;
      border: 1px solid #ccc;
      border-radius: 0 2px 2px 0;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
    }
    .search-box button:hover { background: #e9e9e9; }

    /* Main Container */
    .container {
      max-width: 1200px;
      margin: 15px auto;
      padding: 0 12px;
    }

    /* Player View */
    #player-section {
      display: none;
      background: #fff;
      padding: 12px;
      border: 1px solid #e2e2e2;
      margin-bottom: 20px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .player-header {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 8px;
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: #666;
      padding: 2px 6px;
    }
    .close-btn:hover { color: #000; }

    #player-section video {
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 520px;
      background: #000;
      display: block;
    }
    #player-title {
      font-size: 16px;
      margin-top: 10px;
      font-weight: bold;
      line-height: 1.3;
    }
    #player-date {
      font-size: 11px;
      color: #666;
      margin-top: 4px;
    }

    /* Star Rating Row */
    .rt-rating-row {
      margin-top: 10px;
      padding: 8px 0;
      border-top: 1px solid #d3d3d3;
      border-bottom: 1px solid #d3d3d3;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #333;
      flex-wrap: wrap;
      gap: 6px;
    }
    .rt-stars {
      color: #cc9900;
      font-size: 15px;
      letter-spacing: 2px;
    }

    /* Comments Section */
    .rt-comments-section {
      margin-top: 14px;
    }
    .rt-comments-header {
      font-weight: bold;
      font-size: 13px;
      border-bottom: 2px solid #555;
      padding-bottom: 4px;
      margin-bottom: 10px;
      color: #222;
    }
    .rt-comment-item {
      display: flex;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
      font-size: 12px;
      line-height: 1.4;
    }
    .rt-avatar {
      width: 30px;
      height: 30px;
      background: #e2e2e2;
      border: 1px solid #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .rt-username {
      color: #0033cc;
      font-weight: bold;
    }
    .rt-comment-stars {
      color: #d19200;
      font-size: 11px;
      margin-left: 6px;
    }
    .rt-comment-text {
      margin-top: 2px;
      color: #222;
      word-break: break-word;
    }

    /* Video Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }
    .video-card {
      background: #fff;
      border: 1px solid #e2e2e2;
      border-radius: 2px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
    }
    .video-card:hover { border-color: #999; }
    .thumbnail-wrap {
      width: 100%;
      padding-top: 56.25%;
      position: relative;
      background: #000;
    }
    .thumbnail-wrap img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .video-info {
      padding: 10px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .video-title {
      font-size: 13px;
      font-weight: bold;
      color: #03c;
      line-height: 1.3;
      margin-bottom: 6px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .video-meta-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 11px;
      color: #777;
    }
    .video-date { color: #555; }
    .video-file {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Pagination */
    .pagination {
      margin: 25px 0;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 4px;
    }
    .pagination button {
      background: #fff;
      border: 1px solid #ccc;
      color: #03c;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      min-width: 36px;
      min-height: 36px;
    }
    .pagination button.active {
      background: #cc181e;
      color: #fff;
      border-color: #cc181e;
    }
    .pagination button:disabled {
      color: #aaa;
      cursor: default;
      border-color: #e5e5e5;
    }

    /* Mobile Breakpoints (< 640px) */
    @media (max-width: 640px) {
      header {
        padding: 8px 12px;
        gap: 8px;
      }
      .logo {
        font-size: 20px;
      }
      .search-box {
        width: 100%;
        max-width: 100%;
        order: 2;
      }
      .grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      #player-section {
        padding: 8px;
        margin-bottom: 16px;
      }
      #player-title {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" onclick="resetSearch()">Retro<span>Tube</span></a>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Search videos...">
      <button onclick="handleSearch()">Search</button>
    </div>
  </header>
  <div class="container">
    <div id="player-section">
      <div class="player-header">
        <button class="close-btn" onclick="closePlayer()" title="Close player">✕ Close</button>
      </div>
      <video id="video-element" controls playsinline autoplay></video>
      <div id="player-title"></div>
      <div id="player-date"></div>

      <!-- RetroTube Star Ratings & Comments -->
      <div class="rt-rating-row">
        <div>
          <strong>Rating:</strong>
          <span class="rt-stars" id="rtStarsDisplay">★★★★☆</span>
          <span id="rtRatingInfo" style="color:#666; font-size:11px; margin-left:6px;">(4.5 avg · calculating...)</span>
        </div>
      </div>

      <div class="rt-comments-section">
        <div class="rt-comments-header">
          <span id="rtCommentTitle">Comments</span>
        </div>
        <div id="rtCommentsContainer">
          <div style="color:#888; font-size:11px; padding:6px 0;">Loading comments...</div>
        </div>
      </div>
    </div>

    <div class="grid" id="video-grid"></div>
    <div class="pagination" id="pagination"></div>
  </div>

  <script>
    let currentPage = 1;
    let searchQuery = '';

    function closePlayer() {
      const p = document.getElementById('player-section');
      const v = document.getElementById('video-element');
      if (v) { v.pause(); v.src = ''; }
      if (p) { p.style.display = 'none'; }
    }

    function formatDate(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      return d.toLocaleDateString(undefined, {
        year: 'numeric',
        month: 'short',
        day: 'numeric'
      });
    }

    async function loadVideos(page = 1, query = '') {
      currentPage = page;
      searchQuery = query;
      try {
        const res = await fetch(`/api/videos?page=${page}&q=${encodeURIComponent(query)}&limit=12`);
        const data = await res.json();
        renderGrid(data.videos || []);
        renderPagination(data.page || 1, data.totalPages || 1);
      } catch (err) {
        console.error('Failed to load videos:', err);
      }
    }

    function renderGrid(videos) {
      const grid = document.getElementById('video-grid');
      grid.innerHTML = '';
      if (!videos.length) {
        grid.innerHTML = '<p style="color:#666; font-size:14px; grid-column: 1/-1;">No videos found.</p>';
        return;
      }
      videos.forEach(v => {
        const card = document.createElement('div');
        const formattedDate = formatDate(v.mtime);
        card.className = 'video-card';
        card.onclick = () => playVideo(v.id, v.title, formattedDate);
        card.innerHTML = `
          <div class="thumbnail-wrap">
            <img src="/api/thumbnail/${v.id}" loading="lazy" onerror="this.style.display='none'">
          </div>
          <div class="video-info">
            <div class="video-title">${escapeHtml(v.title)}</div>
            <div class="video-meta-row">
              <span class="video-date">Added: ${formattedDate}</span>
              <span class="video-file">${escapeHtml(v.filename)}</span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function renderPagination(current, total) {
      const pag = document.getElementById('pagination');
      pag.innerHTML = '';
      if (total <= 1) return;

      const prevBtn = document.createElement('button');
      prevBtn.textContent = '« Prev';
      prevBtn.disabled = current === 1;
      prevBtn.onclick = () => loadVideos(current - 1, searchQuery);
      pag.appendChild(prevBtn);

      for (let i = 1; i <= total; i++) {
        const btn = document.createElement('button');
        btn.textContent = i;
        if (i === current) btn.className = 'active';
        btn.onclick = () => loadVideos(i, searchQuery);
        pag.appendChild(btn);
      }

      const nextBtn = document.createElement('button');
      nextBtn.textContent = 'Next »';
      nextBtn.disabled = current === total;
      nextBtn.onclick = () => loadVideos(current + 1, searchQuery);
      pag.appendChild(nextBtn);
    }

    function playVideo(id, title, dateStr) {
      const playerSec = document.getElementById('player-section');
      const videoEl = document.getElementById('video-element');
      const titleEl = document.getElementById('player-title');
      const dateEl = document.getElementById('player-date');

      playerSec.style.display = 'block';
      titleEl.textContent = title;
      dateEl.textContent = dateStr ? `Added on ${dateStr}` : '';
      loadRetroTubeComments(id, title);
      videoEl.src = `/api/stream/${id}`;
      playerSec.scrollIntoView({ behavior: 'smooth' });
    }

    function handleSearch() {
      closePlayer();
      const q = document.getElementById('search-input').value;
      loadVideos(1, q);
    }

    document.getElementById('search-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleSearch();
    });

    function resetSearch() {
      closePlayer();
      document.getElementById('search-input').value = '';
      loadVideos(1, '');
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }

    loadVideos();

    let currentRtPoll = null;
    async function loadRetroTubeComments(vidId, vidTitle) {
      if (currentRtPoll) clearInterval(currentRtPoll);

      async function fetchComments() {
        try {
          const res = await fetch('/api/comments?id=' + encodeURIComponent(vidId) + '&title=' + encodeURIComponent(vidTitle || vidId));
          if (!res.ok) return;
          const data = await res.json();
          const comments = data.comments || [];

          if (comments.length > 0) {
            const sum = comments.reduce((acc, c) => acc + (c.stars || 5), 0);
            const avg = (sum / comments.length).toFixed(1);
            const round = Math.round(avg);
            document.getElementById("rtStarsDisplay").textContent = "★".repeat(round) + "☆".repeat(5 - round);
            document.getElementById("rtRatingInfo").textContent = `(${avg} avg · ${comments.length} ratings)`;
            document.getElementById("rtCommentTitle").textContent = `Comments (${comments.length})`;

            let html = "";
            comments.forEach(c => {
              const stars = "★".repeat(c.stars || 5) + "☆".repeat(5 - (c.stars || 5));
              html += `
                <div class="rt-comment-item">
                  <div class="rt-avatar">👤</div>
                  <div style="flex:1;">
                    <div>
                      <span class="rt-username">${escapeHtml(c.username)}</span>
                      <span class="rt-comment-stars">${stars}</span>
                    </div>
                    <div class="rt-comment-text">${escapeHtml(c.comment)}</div>
                  </div>
                </div>
              `;
            });
            document.getElementById("rtCommentsContainer").innerHTML = html;
          } else {
            document.getElementById("rtStarsDisplay").textContent = "★★★★☆";
            document.getElementById("rtRatingInfo").textContent = "(Awaiting ratings)";
            document.getElementById("rtCommentTitle").textContent = "Comments (0)";
            document.getElementById("rtCommentsContainer").innerHTML = '<div style="color:#888; font-size:11px; padding:6px 0;">No comments yet.</div>';
          }
        } catch (e) {
          console.error("Error fetching comments:", e);
        }
      }

      fetchComments();
      currentRtPoll = setInterval(fetchComments, 4000);
    }
  </script>
</body>
</html>
